task_type: regression
corpus: clister
task: regr
subset: source
lang: fr

hf_loader: data_loaders_hf/CLISTER.py
label_column: label
text_columns: [text_1, text_2]
max_position_embeddings: 512
fewshot: 1.0
dedup:
  scope: cascade
  drop_empty: false
  drop_all_negative: false

metrics: "rmse"
direction: ["min", "minimize"]

search_space:
  learning_rate: tune.loguniform(1e-6, 1e-4)
  num_train_epochs: tune.qrandint(10, 30, 10)
  gradient_accumulation_steps: tune.randint(1, 5)
  weight_decay: tune.uniform(0, .5)
  warmup_ratio: tune.uniform(0, .5)
  dropout: tune.uniform(0, .5)
fixed:
  per_device_train_batch_size: 16
scheduler:
  reduction_factor: 2
  grace_period: 4
  max_t: 100
n_trials: 20
