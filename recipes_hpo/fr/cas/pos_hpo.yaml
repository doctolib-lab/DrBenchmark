task_type: token_classification
corpus: cas
task: pos
subset: pos
lang: fr

hf_loader: data_loaders_hf/CAS.py
label_column: pos_tags
max_position_embeddings: 512
fewshot: 1.0
dedup:
  scope: cascade
  drop_empty: false
  drop_all_negative: false

metrics: "f1"
direction: ["max", "maximize"]

search_space:
  learning_rate: tune.loguniform(1e-6, 1e-4)
  per_device_train_batch_size: tune.qrandint(8, 16, 8)
  num_train_epochs: tune.qrandint(10, 20, 10)
  weight_decay: tune.uniform(0, .5)
  warmup_ratio: tune.uniform(0, .5)
  dropout: tune.uniform(0, .5)
fixed: {}
scheduler:
  reduction_factor: 2
  grace_period: 2
  max_t: 100
n_trials: 2
