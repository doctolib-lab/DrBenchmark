task_type: token_classification
corpus: mantragsc
task: ner
subset: all  # the pooled corpus, not a loader config
lang: nl

hf_loader: data_loaders_hf/MANTRAGSC.py
label_column: ner_tags
max_position_embeddings: 512
fewshot: 1.0
merge_subsets: [nl_emea, nl_medline]  # the loader declares no Dutch patents
dedup:
  scope: cascade
  drop_empty: false
  drop_all_negative: true

metrics: "f1"
direction: ["max", "maximize"]

search_space:
  learning_rate: tune.loguniform(1e-6, 1e-4)
  per_device_train_batch_size: tune.qrandint(8, 16, 4)
  num_train_epochs: tune.qrandint(10, 50, 10)
  weight_decay: tune.uniform(0, .5)
  warmup_ratio: tune.uniform(0, .5)
  dropout: tune.uniform(0, .5)
fixed: {}
scheduler:
  reduction_factor: 2
  grace_period: 4
  max_t: 100
n_trials: 20
